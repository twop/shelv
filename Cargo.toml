[workspace]
members = [".", "site", "shared"]
default-members = ["."]

[workspace.package]
edition = "2024"

[workspace.dependencies]
const-dotenvy = "0.1.0"
pulldown-cmark = "0.11.0"

[package]
name = "shelv"
version = "1.4.0"
edition = "2024"
description = "Note taking app optimized for capturing phase."

[dependencies]
# eframe = { path = "../../pub-frameworks/contributing/egui/crates/eframe", features = [
#   "wgpu",
#   "persistence",
#   "ron",
# ] }
# egui_extras = { path = "../../pub-frameworks/contributing/egui/crates/egui_extras", features = [
#   "svg",
# ] }

# eframe = { git = "https://github.com/twop/egui", branch = "configurable-window", features = [
#   "wgpu",
#   "persistence",
#   "ron",
# ] }

# egui_extras = { git = "https://github.com/twop/egui", branch = "configurable-window", features = [
#   "svg",
# ] }

eframe = { version = "0.36.2", default-features = false, features = [
    "wgpu",
    "persistence",
    # the egui fork made OS clipboard an opt-in feature (crates.io 0.36.2 always enabled it)
    "clipboard",
] }
wgpu = { version = "30", default-features = false, features = ["metal"] }
egui_extras = { version = "0.36.2", features = ["svg"] }

serde = { version = "1.0.197", features = ["derive"] }
ron = "0.8"
global-hotkey = "0.5.3"
image = "0.25.1"
pulldown-cmark = "0.11.0"
syntect = { version = "5.0.0", default-features = false, features = [
    "default-fancy",
] }
smallvec = "1.10.0"
smol_str = "0.3.1"
tray-icon = "0.14.0"
egui-phosphor = { version = "0.14.0", features = ["light"] }
# tray-item = "0.7.1"
winit = "0.30.12"
linkify = "0.10.0"
objc2 = "0.5.1"
objc2-app-kit = "0.2.2"
objc2-foundation = "0.2.2"
boa_engine = "0.22.0"
boa_parser = "0.22.0"
boa_runtime = "0.22.0"
boa_gc = "0.22.0"
# TypeScript type stripping (strip-only, positions preserved) for .ts settings/note blocks and system.ts
swc_ts_fast_strip = "59"
swc_common = "26"
serde_json = "1.0.115"
# decoding settings values from Boa (via JsValue::to_json) with error paths
serde_path_to_error = "0.1"
strum = { version = "0.28", features = ["derive"] }
directories-next = "2.0.0"
hotwatch = "0.5.0"
itertools = "0.13.0"
genai = "0.3.5"
tokio = { version = "1.40.0", features = ["full"] }
tokio-stream = "0.1.15"
sentry = "0.34.0"
fxhash = "0.2.1"
similar = "2.6.0"
const-dotenvy = { workspace = true }
shared = { path = "shared" }

chrono = "0.4.40"
egui_taffy = "0.14.0"
reqwest = "0.12.23"
regex = "1.11.3"
unicode-segmentation = "1.13.3"

[patch.crates-io]
# egui fork with `LayoutSection::hanging_indent` (used for markdown lists)
eframe = { git = "https://github.com/twop/egui", branch = "twop/persisten-wrap-indent" }
egui = { git = "https://github.com/twop/egui", branch = "twop/persisten-wrap-indent" }
egui_extras = { git = "https://github.com/twop/egui", branch = "twop/persisten-wrap-indent" }
egui-wgpu = { git = "https://github.com/twop/egui", branch = "twop/persisten-wrap-indent" }
egui-winit = { git = "https://github.com/twop/egui", branch = "twop/persisten-wrap-indent" }
epaint = { git = "https://github.com/twop/egui", branch = "twop/persisten-wrap-indent" }
emath = { git = "https://github.com/twop/egui", branch = "twop/persisten-wrap-indent" }
ecolor = { git = "https://github.com/twop/egui", branch = "twop/persisten-wrap-indent" }
winit = { git = 'https://github.com/twop/winit-no-private-api', branch = "removed-private-api-v30-12" }

[package.metadata.bundle]
name = "Shelv"
identifier = "app.shelv"
icon = ["assets/shelv-app-icon.icns"]
resources = ["assets"]
copyright = "Copyright (c) Briskmode Labs 2023. All rights reserved."
category = "Productivity"
short_description = "Hackable playground for ephemeral thoughts."
long_description = """
Hackable playground for ephemeral thoughts.
"""

# requires cargo-bundle >= 0.12.0 (macOS keys moved into this sub-table)
[package.metadata.bundle.osx]
minimum_system_version = "12.0"
# raw Info.plist fragments, e.g. CFBundleDocumentTypes (no dedicated cargo-bundle key)
info_plist_exts = ["distribution/Info.ext.plist"]
